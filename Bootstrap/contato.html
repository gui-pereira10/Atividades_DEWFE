<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <nav class="menuNav">
            <div><a href="index.html"><img id="nike" src="logoNike2.jpg" alt="logoNike"></a></div>
            <ul class="navLinks">
                <li>
                    <p><a href="index.html">Home</a></p>
                </li>
                <li>
                    <p><a href="sobre.html">Sobre</a></p>
                </li>
                <li>
                    <p><a href="contato.html">Contate-nos</a></p>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container mt-5">

            <h1 class="mb-4">Contato</h1>

            <p>Entre em contato para dúvidas ou sugestões</p>

            <form>

                <div class="mb-3">

                    <label class="form-label">Nome</label>

                    <input type="text" class="form-control" placeholder="Digite seu nome">

                </div>

                <div class="mb-3">

                    <label class="form-label">Email</label>

                    <input type="email" class="form-control" placeholder="Digite seu email">
                </div>

                <div class="mb-3">

                    <label class="form-label">Mensagem</label>

                    <textarea class="form-control" rows="5" placeholder="Digite sua mensagem"></textarea>

                </div>

                <button class="btn btn-dark">Enviar</button>

            </form>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
